[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = nodemcu-32s
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@6.21.5

[env:esp32dev_death_test]
extends = env:esp32dev
build_flags =
    -DPET_DEATH_TEST_MODE=1

[env:esp32dev_growth_test]
extends = env:esp32dev
build_flags =
    -DPET_GROWTH_TEST_MODE=1

[env:esp32dev_memorial_test]
extends = env:esp32dev
build_flags =
    -DPET_GROWTH_TEST_MODE=1
    -DPET_MEMORIAL_TEST_MODE=1

[env:esp32dev_sleep_test]
extends = env:esp32dev
build_flags =
    -DPET_SLEEP_TEST_MODE=1

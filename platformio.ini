[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = nodemcu-32s
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
monitor_speed = 115200
build_flags =
    -DPET_FIRMWARE_VERSION=\"1.3.0\"
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@6.21.5
    h2zero/NimBLE-Arduino@2.5.0

[env:esp32dev_death_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_DEATH_TEST_MODE=1

[env:esp32dev_growth_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_GROWTH_TEST_MODE=1

[env:esp32dev_memorial_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_GROWTH_TEST_MODE=1
    -DPET_MEMORIAL_TEST_MODE=1

[env:esp32dev_sleep_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_SLEEP_TEST_MODE=1

[env:esp32dev_dirty_preview]
extends = env:esp32dev
build_src_filter = +<*> -<main.cpp>
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_DIRTY_PREVIEW_MODE=1

[env:esp32dev_deep_sleep_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DPET_DEEP_SLEEP_TEST_MODE=1

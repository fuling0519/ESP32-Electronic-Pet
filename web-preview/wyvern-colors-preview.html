<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小飛龍配色前後對照</title><style>body{font:17px sans-serif;background:#fbf2e4;color:#49374f;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,360px));justify-content:center;gap:16px}article{background:#dfeacb;padding:14px;border-radius:16px}canvas{width:100%;image-rendering:pixelated}select{font:inherit;padding:8px}h2{font-size:20px}</style><h1>小飛龍 · 配色前後對照</h1><p>紫色頭身、手腳、翅膀及尾巴，僅中央肚皮鵝黃。</p><label>動作 <select id="state"><option value="Idle">待機／摸頭／戳戳本體</option><option value="Sad">傷心／生病／倒藥</option><option value="Sleep">睡眠</option><option value="Eating">餵食</option></select></label><div class="grid" id="grid"></div><script src="pet-rules.js"></script><script src="wyvern-sprites.js"></script><script src="assets/wyvern-colors-before-20261020.js"></script><script src="wyvern-view.js?v=belly-only"></script><script>
const views=[];for(const stage of ['baby','adult'])for(const before of [true,false]){const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');c.width=256;c.height=176;h.textContent=(stage==='baby'?'幼年':'成年')+' · '+(before?'修改前':'修改後');a.append(h,c);grid.append(a);views.push({stage,before,ctx:c.getContext('2d')});}function draw(now){for(const v of views){v.ctx.clearRect(0,0,256,176);const frames=WyvernFrames[(v.stage==='baby'?'kBabyWyvern':'kWyvern')+state.value+'Frames'],fps=state.value==='Idle'?6:state.value==='Eating'?1000/375:1;const bits=frames[Math.floor(now*fps/1000)%frames.length];(v.before?WyvernBeforeView:WyvernView).paint(v.ctx,bits,0,0,4);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>

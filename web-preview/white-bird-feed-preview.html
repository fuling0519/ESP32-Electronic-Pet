<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鳥低頭吃飼料</title><style>body{max-width:800px;margin:30px auto;padding:16px;background:#fff6df;color:#57483a;font:16px sans-serif}canvas{width:100%;image-rendering:pixelated;background:center/cover url('assets/garden-detailed-day.png');border:2px solid #bbaa95;border-radius:16px}button,select{padding:12px;margin:12px}</style><h1>小鳥低頭吃飼料</h1><p>低頭啄食三次 → 飼料逐步減少 → 抬頭吞嚥；沿用三秒餵食時間。</p><label>階段 <select id="stage"><option value="adult">成年</option><option value="baby">幼年</option></select></label><button id="replay">重新餵食</button><label><input id="reduced" type="checkbox">減少動態</label><canvas width="768" height="512"></canvas><p>與完整 Web 共用角色與食盆繪圖程式，僅展示，不改養成數值。</p><script src="assets/pets/bird/white-activity-data-v1.js"></script><script src="assets/items/blue-seed-bowl-data-v1.js"></script><script src="white-bird-feed.js?v=peck-feed-v1"></script><script src="blue-seed-bowl.js?v=blue-seed-v1"></script><script>const ctx=document.querySelector('canvas').getContext('2d'),stage=document.querySelector('#stage'),reduced=document.querySelector('#reduced');reduced.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;let start=performance.now();document.querySelector('#replay').onclick=()=>start=performance.now();stage.onchange=()=>start=performance.now();function tick(now){const t=Math.min(3,(now-start)/1000),p={stage:stage.value};ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,384,256);WhiteBirdFeed.draw(ctx,p,t,3,reduced.checked);WhiteBirdFeed.bowl(ctx,p,t);requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>

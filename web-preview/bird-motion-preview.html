<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鳥八種動作試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f0df;color:#56463f;font:16px/1.7 'Microsoft JhengHei',sans-serif}main{max-width:1000px;margin:auto;padding:24px}header{text-align:center}h1{margin:4px;font-size:28px}.badge{font-size:13px;color:#927767}header p{margin:4px 0 20px}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px}.states{display:grid;gap:9px;align-content:start}button,select{font:inherit;border:1px solid #c9b89e;border-radius:10px;background:#fffaf0;color:inherit;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:#e4edce;border:2px solid #8eaa75;font-weight:bold}.panel{min-width:0;border:2px solid #d5c1a4;border-radius:18px;overflow:hidden;background:#fffbf2;box-shadow:0 8px 24px #66553713}.scene{aspect-ratio:3/2;background:#cee4ad url('assets/garden-detailed-day.png') center/100% 100%;position:relative}.scene.night{background-image:url('assets/garden-detailed-night.png')}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.info{padding:16px 20px}h2{margin:0;font-size:21px}.info p{margin:8px 0}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}progress{width:100%;height:9px;accent-color:#91ad7d}.small{font-size:13px;color:#897967}.notice{border-left:3px solid #c2a4bd;background:#f3e9f0;padding:12px 16px;margin-top:20px}button:focus-visible,select:focus-visible{outline:3px solid #ad88b3;outline-offset:3px}@media(max-width:680px){main{padding:12px}.layout{grid-template-columns:1fr}.states{grid-template-columns:repeat(2,minmax(0,1fr))}.states button{font-size:14px}h1{font-size:23px}}
</style></head><body><main><header><span class="badge">小鳥動作試作 · 幼年／成年</span><h1>保留原造型，試看動作節奏</h1><p>選擇狀態即可重播；不讀寫寵物存檔、不結算獎勵。</p></header><div class="layout"><nav class="states" id="states" aria-label="八種動作"></nav><section class="panel"><div class="scene" id="scene"><canvas id="art" width="768" height="512" aria-label="小鳥動作預覽"></canvas></div><div class="info"><h2 id="title"></h2><p id="description"></p><progress id="progress" max="1" value="0" aria-label="動作進度"></progress><div class="tools"><label>階段 <select id="stage"><option value="baby">幼鳥</option><option value="adult">成鳥</option></select></label><button id="play">暫停</button><button id="replay">重新播放</button><button id="night">午後／夜晚</button></div><label class="small"><input id="reduced" type="checkbox"> 減少動態（靜態查看）</label><p class="small" id="timing"></p></div></section></div><p class="notice">這是沿用現有圖片、以分區動作製作的第一版節奏示意，尚非逐動作新繪圖集。請特別查看頭頸與翅膀接縫、動作幅度及落地是否自然。正式遊戲的照顧時間、數值與存檔維持原樣。</p></main>
<script src="shared-sprites.js"></script><script src="shared-view.js"></script><script src="bird-motion-study.js?v=20261021-v1"></script><script>
const descriptions={idle:'自然散步 → 停下 → 低頭喝水 → 走回來。',sad:'垂頭、失落眼神，翅膀收攏，保持柔和呼吸。',sick:'疲倦半閉眼、翅膀無力，輕微搖晃與明顯冷汗。',sleep:'閉眼放鬆，慢節奏細微呼吸，翅尖輕動。',happy:'幸福側頭 → 輕蹬地 → 拍翅升起 → 懸停 → 柔和落地。',startled:'短暫蓄力 → 受驚彈跳與展翼 → 落地緩衝 → 眨眼觀察。',feed:'看食物 → 低頭啄食三次 → 抬頭吞嚥與眨眼。',curious:'好奇睜眼、左右側頭觀察，保留原本眼型。'};
const art=document.querySelector('#art'),ctx=art.getContext('2d');ctx.setTransform(2,0,0,2,0,0);
let state='idle',stage='baby',elapsed=0,last=null,playing=true;const buttons=new Map();
function refresh(){document.querySelector('#title').textContent=BirdMotionStudy.definitions[state][0];document.querySelector('#description').textContent=descriptions[state];document.querySelector('#timing').textContent='循環 '+BirdMotionStudy.definitions[state][1]/1000+' 秒 · 固定攝影機 · 原配色與比例';for(const [key,b] of buttons)b.setAttribute('aria-pressed',String(key===state));}
for(const [key,[text,ms]] of Object.entries(BirdMotionStudy.definitions)){const b=document.createElement('button');b.textContent=text+' · '+ms/1000+'秒';b.onclick=()=>{state=key;elapsed=0;refresh();};buttons.set(key,b);document.querySelector('#states').append(b);}
document.querySelector('#stage').onchange=e=>{stage=e.target.value;elapsed=0;};document.querySelector('#replay').onclick=()=>{elapsed=0;};document.querySelector('#night').onclick=()=>document.querySelector('#scene').classList.toggle('night');document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暫停':'繼續';};document.querySelector('#reduced').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now){if(last!==null&&playing&&!document.hidden)elapsed+=Math.min(100,now-last);last=now;ctx.clearRect(0,0,384,256);BirdMotionStudy.render(ctx,stage,state,elapsed,document.querySelector('#reduced').checked);document.querySelector('#progress').value=elapsed%BirdMotionStudy.definitions[state][1]/BirdMotionStudy.definitions[state][1];requestAnimationFrame(draw);}refresh();requestAnimationFrame(draw);
</script></body></html>

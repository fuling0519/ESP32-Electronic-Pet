<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>成年小龍・全部狀態</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f9f3;color:#423d46;font:16px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{margin:0}p{margin:8px 0 20px}a{color:#4d6842}button{font:inherit;padding:8px 16px;border:1px solid #c9ccbe;background:white;border-radius:12px;cursor:pointer}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}article{background:white;border:1px solid #e1dfd7;border-radius:18px;overflow:hidden}article h2{font-size:18px;margin:12px 18px 0}article p{font-size:14px;margin:0 18px 14px;color:#6c6670}.scene{aspect-ratio:3/2;position:relative;background:center/cover url('assets/garden-detailed-day.png')}.scene canvas{width:100%;height:100%;image-rendering:pixelated}.night .scene{background-image:url('assets/garden-detailed-night.png')}.night{background:#292c37;color:#eee5f1}.night article{background:#383847;border-color:#545262}.night article p{color:#d0c5d7}
</style>
<main><header><div><h1>成年小龍・全部狀態</h1><a href="index.html?preview=wyvern">進入花園互動展示</a></div><button id="light">切換夜晚</button></header>
<p>使用花園展示相同的角色繪製程式。這裡只預覽外觀，不讀寫寵物存檔；死亡會保持顯示，方便比較。</p>
<section class="grid" id="states"></section></main>
<script src="wyvern-adult-view.js?v=sleep-scale-20261023"></script>
<script>
const states=[['idle','待機','四格小幅振翅'],['sad','傷心','委屈、垂翼與眨眼'],['sick','生病','疲倦、半睜眼與閉眼休息'],['happy','開心','小豆眼與滿足笑眼'],['shock','驚嚇（被戳）','嚇一跳：張翼、雙手張開、小嘴微張；花園中另加驚嘆號與小幅彈動'],['sleep','蜷縮睡眠','兩格呼吸，約兩秒一圈'],['dead','死亡','閉眼、嘴角微垂、側躺靜態'],['flight','低空飛行','六格拍翼、起落與左右翻面；減少動態時回到地面待機']];
const previews=states.map(([state,title,description])=>{const card=document.createElement('article'),heading=document.createElement('h2'),text=document.createElement('p'),scene=document.createElement('div'),canvas=document.createElement('canvas');heading.textContent=title;text.textContent=description;scene.className='scene';canvas.width=768;canvas.height=512;canvas.setAttribute('aria-label',title+'小龍');scene.append(canvas);card.append(scene,heading,text);document.querySelector('#states').append(card);const ctx=canvas.getContext('2d');ctx.scale(2,2);return {state,ctx};});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function draw(now){for(const {state,ctx} of previews){ctx.clearRect(0,0,384,256);if(state==='flight')WyvernAdultView.paintTravel(ctx,now,reduced.matches);else WyvernAdultView.paint(ctx,state,now,reduced.matches);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
document.querySelector('#light').onclick=()=>{const night=document.body.classList.toggle('night');document.querySelector('#light').textContent=night?'切換白天':'切換夜晚';};
</script>
</html>

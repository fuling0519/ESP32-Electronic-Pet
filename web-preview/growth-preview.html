<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>孵化與長大預覽</title><style>body{text-align:center;background:#f7f0dd;color:#57483a;font:18px sans-serif}canvas{width:min(90vw,768px);height:auto;background:url('assets/garden-detailed-day.png') center/cover;image-rendering:pixelated;border-radius:16px}button,select{font:inherit;padding:12px;margin:8px}</style><h1>孵化／長大轉場檢查</h1><p>獨立預覽，不改存檔。</p><select id="species"><option value="1">小鳥</option><option value="2">小飛龍</option></select><button onclick="incubate()">蛋 → 幼年</button><button onclick="play('baby','adult')">幼年 → 成年</button><button onclick="incubate()">領蛋 → 孵化中 → 幼年（快轉預覽）</button><br><canvas id="art" width="384" height="256"></canvas><p>2.4秒後返回正常角色；可重播比較。</p><script src="pet-rules.js"></script><script src="wyvern-sprites.js"></script><script src="wyvern-view.js"></script><script src="bird-view.js?v=no-baby-flash-20261019"></script><script src="shared-sprites.js?v=egg-20261019"></script><script src="shared-view.js"></script><script src="egg-view.js?v=no-baby-flash-20261019"></script><script src="growth-view.js?v=no-baby-flash-20261019"></script><script>
const ctx=document.querySelector('#art').getContext('2d');let target='egg',eggStart=null;function incubate(){eggStart=performance.now();PetGrowthView.observe(null);}function play(from,to){target=to;PetGrowthView.observe(null);const p={petId:'preview',stage:from,healthState:'healthy'};PetGrowthView.observe(p,+species.value);PetGrowthView.observe({...p,stage:to},+species.value);}function draw(now){ctx.clearRect(0,0,384,256);if(eggStart!==null){const age=[0,240,270,300][Math.min(3,Math.floor((now-eggStart)/1200))];if(age<300){PetEggView.draw(ctx,age,now);requestAnimationFrame(draw);return;}eggStart=null;play('egg','baby');}if(!PetGrowthView.draw(ctx,now,matchMedia('(prefers-reduced-motion: reduce)').matches)){if(target==='egg'){PetEggView.draw(ctx,0,now);}else if(species.value==='1')BirdView.still(ctx,target,false,190,128,3);else WyvernView.paint(ctx,WyvernFrames[target==='baby'?'kBabyWyvernIdleFrames':'kWyvernIdleFrames'][0]);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>

<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>孵化與長大預覽</title><style>body{text-align:center;background:#f7f0dd;color:#57483a;font:18px sans-serif}canvas{width:min(90vw,768px);height:auto;background:url('assets/garden-detailed-day.png') center/cover;image-rendering:pixelated;border-radius:16px}button,select{font:inherit;padding:12px;margin:8px}</style><h1>孵化／長大轉場檢查</h1><p>獨立預覽，不改存檔。</p><select id="species"><option value="1">小鳥</option><option value="2">小飛龍</option></select><select id="design" aria-label="蛋殼花紋"><option value="preview-1">斑點蛋</option><option value="preview-2">點點蛋</option><option value="preview-0">波浪紋蛋</option></select><button onclick="play('egg','baby')">蛋 → 幼年</button><button onclick="play('baby','adult')">幼年 → 成年</button><button onclick="incubate()">領蛋 → 孵化中 → 幼年（快轉預覽）</button><br><canvas id="art" width="384" height="256"></canvas><p>孵化 4.2 秒、長大 3.6 秒後返回正常角色；快轉預覽每 2.4 秒換一個裂痕階段。可重播比較。</p><script src="pet-rules.js"></script><script src="wyvern-sprites.js"></script><script src="wyvern-view.js"></script><script src="wyvern-adult-view.js?v=demo-tools-20261023"></script><script src="bird-view.js?v=no-baby-flash-20261019"></script><script src="shared-sprites.js?v=egg-20261019"></script><script src="shared-view.js"></script><script src="assets/pets/egg/egg-hatch-data-v1.js?v=egg-art-20261024"></script><script src="egg-view.js?v=egg-art-20261024"></script><script src="assets/shared/cleaning/animation-v1/animation-data.js"></script><script src="cleaning-animation-view.js?v=web-integration-v1"></script><script src="growth-view.js?v=grow-orb-b-20261024"></script><script>
const ctx=document.querySelector('#art').getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');let target='egg',eggStart=null;
function petId(){return document.querySelector('#design').value;}
function incubate(){target='egg';eggStart=performance.now();PetGrowthView.observe(null);}
function play(from,to){eggStart=null;target=to;PetGrowthView.observe(null);const p={petId:petId(),name:'Tamama',stage:from,healthState:'healthy'};PetGrowthView.observe(p,+species.value);PetGrowthView.observe({...p,stage:to},+species.value);}
function draw(now){ctx.clearRect(0,0,384,256);
 if(eggStart!==null){const age=[0,240,270,300][Math.min(3,Math.floor((now-eggStart)/2400))];if(age<300){PetEggView.draw(ctx,age,now,reduced.matches,false,petId());requestAnimationFrame(draw);return;}play('egg','baby');}
 if(!PetGrowthView.draw(ctx,now,reduced.matches)){if(target==='egg')PetEggView.draw(ctx,0,now,reduced.matches,false,petId());else if(species.value==='1')BirdView.still(ctx,target,false,190,128,target==='baby'?2.5:3);else if(!window.WyvernAdultView?.paint(ctx,'idle',0,true,{stage:target}))WyvernView.paint(ctx,WyvernFrames[target==='baby'?'kBabyWyvernIdleFrames':'kWyvernIdleFrames'][0]);}
 requestAnimationFrame(draw);}
document.querySelector('#design').onchange=()=>{if(target!=='egg')target='egg';};
requestAnimationFrame(draw);
</script></html>

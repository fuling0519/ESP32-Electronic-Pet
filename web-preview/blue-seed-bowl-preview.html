<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>藍色飼料盆・逐步吃完</title><style>body{max-width:800px;margin:30px auto;padding:16px;background:#fff6df;color:#57483a;font:16px sans-serif}canvas{width:100%;background:#e8edd8;image-rendering:pixelated;border:2px solid #bbaa95;border-radius:16px}button{padding:12px;margin:12px}</style><h1>藍色飼料盆</h1><p>滿盆 → 吃掉一部分 → 剩少量 → 空盆；每格 0.75 秒，共 3 秒。</p><button id="replay">重新餵食</button><p id="status"></p><canvas width="768" height="400"></canvas><p>左邊為遊戲顯示大小，右邊放大查看。僅展示，不改養成數值。</p><script src="assets/items/blue-seed-bowl-data-v1.js"></script><script src="blue-seed-bowl.js?v=blue-seed-v1"></script><script>const ctx=document.querySelector('canvas').getContext('2d'),status=document.querySelector('#status');let start=performance.now();document.querySelector('#replay').onclick=()=>start=performance.now();function tick(now){const t=Math.min(3,(now-start)/1000);ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,384,200);BlueSeedBowl.draw(ctx,t,85,145,64);BlueSeedBowl.draw(ctx,t,265,160,172);status.textContent=['滿盆','吃掉一部分','剩少量','空盆'][BlueSeedBowl.frame(t)];requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>

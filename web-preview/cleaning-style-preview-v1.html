<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>共用清潔・配色與尺寸試樣 v1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5ed;color:#403e48;font:15px/1.65 system-ui,sans-serif}main{max-width:840px;padding:24px;margin:auto}h1{font-size:24px;margin:0 0 8px}h2{font-size:16px;margin:8px 12px}p{margin:6px 0 16px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0}label{display:flex;align-items:center;gap:6px}select{padding:6px}input[type=range]{width:100px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.scene{background:center/cover url('assets/garden-detailed-day.png')}body.night .scene{background-image:url('assets/garden-detailed-night.png')}article{background:white;border:1px solid #d7d4d4}canvas{display:block;width:100%;image-rendering:pixelated}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.chip{display:flex;gap:7px;align-items:center}.chip i{width:22px;height:22px;background:var(--swatch);border:1px solid #98949c}.samples{background:repeating-conic-gradient(#eee 0% 25%,#fff 0% 50%) 0 0/16px 16px;border:1px solid #d7d4d4;max-width:550px}.note{font-size:13px;color:#655f6c}a{color:#4a6274}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style>
<main><h1>共用清潔・配色與尺寸試樣 v1</h1>
<p>靜態肥皂＋泡沫，確認配色、描邊、縮小後辨識度及角色比例。未製作完整動畫、未接入正式清潔流程。</p>
<div class="legend"><span class="chip"><i style="--swatch:#F4DFC0"></i>肥皂・暖奶油</span><span class="chip"><i style="--swatch:#DDEFF1"></i>泡沫・藍白</span><span class="chip"><i style="--swatch:#A8CBD6"></i>泡沫陰影・灰藍</span><span class="chip"><i style="--swatch:#786B83"></i>道具描邊・灰紫</span></div>
<p class="note">色票是生成時的目標色，不代表圖片已量化為固定色盤。使用現有角色繪圖程式；幼龍目前仍是原有遮罩版本。</p>
<div class="controls"><label>場景<select id="light"><option value="day">白天</option><option value="night">夜晚</option></select></label><label>肥皂寬<input id="soap" type="range" min="24" max="40" value="32"><output id="soap-value">32</output></label><label>單團泡沫寬<input id="foam" type="range" min="20" max="36" value="28"><output id="foam-value">28</output></label><label><input id="effects" type="checkbox" checked>顯示試樣</label></div>
<p class="note">以 384×256 遊戲畫布計算。預設成年肥皂 32 px、單團泡沫 28 px；幼年約 26／23 px。視窗較窄時整個場景等比縮小。</p>
<section class="grid" id="grid"></section>
<h2>單獨試樣：左側原尺寸，右側放大 4 倍</h2><canvas class="samples" id="samples" width="550" height="128"></canvas>
<p class="note">原圖與裁切紀錄保留於 <a href="assets/shared/cleaning/style-study-v1/README.md">素材說明</a>。只裁去外圍留白，未改色、重畫或拉伸。顯示時等比縮放，生成原圖的像素密度仍待確認。</p>
</main>
<script>window.PetRules={updateSad:()=>false};</script>
<script src="assets/pets/bird/white-idle-data-v4.js"></script><script src="assets/pets/bird/white-sad-data-v1.js"></script><script src="assets/pets/bird/white-sick-data-v1.js"></script><script src="white-bird-view.js"></script><script src="wyvern-sprites.js"></script><script src="wyvern-adult-view.js"></script><script src="wyvern-view.js"></script><script src="cleaning-style-study.js"></script>
<script>
const cards=[['bird','baby','幼鳥'],['bird','adult','成鳥'],['wyvern','baby','幼龍・現有遮罩'],['wyvern','adult','成龍']].map(([species,stage,title])=>{
 const article=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=title;c.width=384;c.height=256;c.className='scene';c.setAttribute('aria-label',title+'清潔配色試樣');article.append(h,c);document.querySelector('#grid').append(article);return {species,stage,ctx:c.getContext('2d')};
});
const soap=document.querySelector('#soap'),foam=document.querySelector('#foam'),effects=document.querySelector('#effects');
document.querySelector('#light').onchange=e=>document.body.classList.toggle('night',e.target.value==='night');
function draw(){document.querySelector('#soap-value').value=soap.value;document.querySelector('#foam-value').value=foam.value;for(const {species,stage,ctx} of cards){ctx.clearRect(0,0,384,256);CleaningStyleStudy.scene(ctx,species,stage,{soapWidth:Number(soap.value),foamWidth:Number(foam.value),visible:effects.checked});}const ctx=document.querySelector('#samples').getContext('2d');ctx.clearRect(0,0,550,128);CleaningStyleStudy.samples(ctx);requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>

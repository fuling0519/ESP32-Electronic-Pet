<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小鳥狀態展示</title><style>body{background:#fff6df;color:#655043;font:16px 'Microsoft JhengHei',sans-serif;margin:24px}h1,p{text-align:center}.toolbar{text-align:center;margin:16px}button{padding:10px 18px;background:#f2e4ee;border:1px solid #bda2b8;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:20px;max-width:1200px;margin:auto}article{background:#fffaf0;border:2px solid #d4bda8;border-radius:16px;overflow:hidden}h2{font-size:18px;text-align:center}.scene{background:#dceabf url('assets/garden-detailed-day.png') center/cover;aspect-ratio:3/2}.scene.night{background-image:url('assets/garden-detailed-night.png')}canvas{display:block;width:100%;image-rendering:pixelated}</style>
<h1>小鳥 · 幼年與成年狀態展示</h1><p>既有小鳥造型；本頁不讀寫寵物存檔。開心、驚嚇及長眠為現有素材搭配效果的示意。</p><div class="toolbar"><button id="night">切換午後／夜晚</button><button id="stage">目前：幼鳥 · 切換成鳥</button></div><div class="grid" id="grid"></div>
<script src="pet-rules.js"></script><script src="bird-view.js?v=idle-preview-only-20261021"></script><script src="bird-demo.js?v=idle-preview-only-20261021"></script><script>
let stage='baby';const cards=[];for(const [state,title] of BirdDemo.states.filter(([s])=>s!=='auto')){const card=document.createElement('article'),h=document.createElement('h2'),scene=document.createElement('div'),canvas=document.createElement('canvas');h.textContent=title;scene.className='scene';canvas.width=384;canvas.height=256;scene.append(canvas);card.append(h,scene);document.querySelector('#grid').append(card);cards.push({state,ctx:canvas.getContext('2d')});}document.querySelector('#night').onclick=()=>document.querySelectorAll('.scene').forEach(el=>el.classList.toggle('night'));document.querySelector('#stage').onclick=()=>{stage=stage==='baby'?'adult':'baby';document.querySelector('#stage').textContent='目前：'+(stage==='baby'?'幼鳥 · 切換成鳥':'成鳥 · 切換幼鳥');};function draw(now){for(const {state,ctx} of cards){ctx.clearRect(0,0,384,256);BirdDemo.paint(ctx,{stage},state,now,190,126,3,matchMedia('(prefers-reduced-motion: reduce)').matches);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>

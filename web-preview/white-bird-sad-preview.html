<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白色小鳥・含淚傷心</title>
<style>body{margin:30px auto;max-width:820px;padding:16px;background:#fff8e8;color:#57483a;font:16px sans-serif}canvas{width:100%;image-rendering:pixelated;background:center/cover url('assets/garden-detailed-day.png');border:3px solid #bbaa95;border-radius:16px}button,select{padding:10px;margin:8px}img{max-width:100%}</style>
<h1>白色小鳥・含淚傷心</h1><p>傷心專用圖：含淚睜眼 2.2 秒、閉眼落淚 0.24 秒，固定頭部與腳底。</p>
<label>階段 <select id="stage"><option value="adult">成年</option><option value="baby">幼年（共用素材縮小）</option></select></label><button id="pause">暫停</button><label><input type="checkbox" id="reduced">減少動態</label>
<canvas id="scene" width="768" height="512"></canvas><p>本頁使用完整 Web 相同繪圖程式；不讀寫養成存檔。不改心情數值；使用專用哭泣表情圖集。</p><details><summary>查看對齊後兩格圖集</summary><img src="assets/pets/bird/white-sad-sheet-v1.png"></details>
<script src="assets/pets/bird/white-idle-data-v4.js"></script><script>window.PetRules={updateSad:()=>false};</script><script src="assets/pets/bird/white-sad-data-v1.js"></script><script src="assets/pets/bird/white-sick-data-v1.js"></script><script src="white-bird-view.js?v=white-sick-v1"></script>
<script>const ctx=document.querySelector('canvas').getContext('2d'),stage=document.querySelector('#stage'),check=document.querySelector('#reduced'),pause=document.querySelector('#pause');check.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;let running=true,t=0,last=performance.now();pause.onclick=()=>{running=!running;pause.textContent=running?'暫停':'播放';};function tick(now){if(running&&!document.hidden)t+=Math.min(100,now-last);last=now;ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,384,256);WhiteBirdView.draw(ctx,{stage:stage.value,healthState:'healthy',sleepMode:'awake'},check.checked?0:t,null,0,true,190,126,3);requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></html>

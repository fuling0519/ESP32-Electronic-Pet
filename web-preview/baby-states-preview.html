<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>幼鳥動作檢查</title><style>body{background:#f6efdf;color:#493c30;font:18px sans-serif;text-align:center}main{max-width:1100px;margin:auto}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}article{background:#e3edcd;border-radius:12px;padding:10px}canvas{width:256px;height:176px;image-rendering:pixelated}button{font:inherit;padding:10px}a{display:block;margin:20px}</style><main><h1>小鳥幼年／成年 · 狀態檢查</h1><label>階段 <select id="preview-stage"><option value="baby">幼年</option><option value="adult">成年</option></select></label><p>外觀預覽不改存檔；正常與傷心睜眼 1600ms／閉眼 1000ms。</p><div class="cards" id="cards"></div><a href="index.html?v=baby-states-20261019&preview=bird">回完整花園</a></main><script src="pet-rules.js"></script><script src="shared-sprites.js"></script><script src="shared-view.js?v=care-final"></script><script src="bird-view.js?v=larger-bird-20261019"></script><script>
const states=[['正常',{},null],['傷心',{mood:30},null],['生病',{healthState:'sick'},null],['睡眠',{sleepMode:'normal'},null],['餵食',{},'feed'],['治療', {healthState:'sick'},'treat'],['清潔',{},'clean']];
const views=states.map(([name,changes,action])=>{const a=document.createElement('article'),h=document.createElement('h2'),c=document.createElement('canvas');h.textContent=name;c.width=384;c.height=264;a.append(h,c);document.querySelector('#cards').append(a);return {ctx:c.getContext('2d'),p:{stage:'baby',healthState:'healthy',sleepMode:'awake',satiety:80,mood:80,cleanliness:100,...changes},action};});
function draw(now){for(const v of views){v.p.stage=document.querySelector("#preview-stage").value;v.ctx.clearRect(0,0,384,264);BirdView.draw(v.ctx,v.p,now,v.action,(now%3400)/1000,false,192,132,4);const t=(now%3400)/1000;if(v.action==='feed'&&t<3)SharedPetView.paint(v.ctx,'kBowlFrames',Math.min(2,Math.floor(t)),235,180,2,'#f0d39a');if(v.action==='treat'){if(t<1.4)SharedPetView.paint(v.ctx,'kPotionFrames',SharedPetView.potionFrame(t),245,30,2);else SharedPetView.recovery(v.ctx,t);}if(v.action==='clean'&&t<2.4)SharedPetView.clean(v.ctx,t);}requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
